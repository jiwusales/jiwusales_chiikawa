<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-VtKkaB5zPPhWM0wACTBnS8ncfLHJW7cBUUIL66dCo4o='; style-src 'sha256-6pDbevVstWyCN1wnVTjC3W8W4tEJHo5pe4CIxm4a/Gw='; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'"><title>吉伊卡哇圖鑑管理入口</title><style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0;padding:28px 18px;min-width:320px;background:#f7f3ec;color:#443b31;font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}main{max-width:580px;margin:9vh auto 0;padding:30px 27px;background:#fffefa;border:1px solid #e6dccd;border-radius:19px;box-shadow:0 10px 32px #69513b08}.eyebrow{font-size:11px;letter-spacing:2px;color:#a18b70;font-weight:700;margin:0 0 8px}h1{font-size:25px;line-height:1.45;margin:0 0 18px;font-weight:650}p{margin:0 0 17px;color:#887763;overflow-wrap:anywhere}.actions{display:flex;flex-direction:column;gap:12px;margin-top:24px}button,a.button{display:flex;align-items:center;justify-content:center;width:100%;min-height:49px;padding:11px 15px;border:1px solid #d7c6b1;border-radius:10px;background:#fffefa;color:#7f654d;font-family:inherit;font-size:16px;line-height:1.5;font-weight:600;text-decoration:none;cursor:pointer;touch-action:manipulation}button{font-family:inherit;font-size:16px}a.primary{background:#7f654d;color:#fffefa;border-color:#7f654d}button:hover{background:#f3ecdf}a.primary:hover{background:#674e38}button:focus-visible,a:focus-visible{outline:3px solid #b29169;outline-offset:4px}.note{font-size:13px;color:#a3947e;margin:19px 0 0}#status{font-size:14px;color:#856f50;margin:15px 0 0;min-height:1.6em}[hidden]{display:none!important}noscript{display:block;max-width:580px;margin:20px auto;padding:20px;background:#fffefa;border:1px solid #e6dccd;border-radius:12px}noscript a{color:#7f654d}@media(max-width:540px){body{padding:18px 14px}main{padding:25px 20px;margin-top:7vh;border-radius:15px}h1{font-size:23px}button,a.button{font-size:16px}}</style></head>
<body><main id="gateway" hidden><p class="eyebrow">JIWU COLLECTION</p><h1>吉伊卡哇圖鑑管理已搬移</h1><p id="message"></p><div class="actions"><button id="downloadDraft" type="button" hidden>下載草稿備份</button><a class="button primary" href="https://jiwu-catalog-admin.jiwusales.workers.dev/?site=chiikawa" rel="noreferrer">前往密碼管理頁</a></div><p id="draftNote" class="note"></p><p id="status" role="status" aria-live="polite"></p></main><noscript>圖鑑管理已搬到新網址。請啟用 JavaScript，先確認並下載舊草稿備份；或<a href="https://jiwu-catalog-admin.jiwusales.workers.dev/?site=chiikawa" rel="noreferrer">前往密碼管理頁</a>。本頁不會刪除既有草稿。</noscript><script>(function(){
'use strict';
const target="https://jiwu-catalog-admin.jiwusales.workers.dev/?site=chiikawa";
const key="jiwu_catalog_admin_draft_v1_chiikawa";
const $=id=>document.getElementById(id);
let draft=null,readable=true;
try{draft=localStorage.getItem(key);}catch(_){readable=false;}
if(readable&&draft===null){try{location.replace(target);return;}catch(_){}}
$('gateway').hidden=false;
if(readable&&draft!==null){
  $('message').textContent='這個瀏覽器還有尚未發布的舊圖鑑草稿。請先下載備份，再前往新的密碼管理頁。';
  $('draftNote').textContent='舊草稿仍保留在目前網址的瀏覽器中，不會自動帶到新管理頁。本頁不會修改或刪除草稿。';
  $('downloadDraft').hidden=false;
  $('downloadDraft').addEventListener('click',()=>{
    const url=URL.createObjectURL(new Blob([draft],{type:'application/json'}));
    const link=document.createElement('a');link.href=url;link.download="jiwu-catalog-draft-chiikawa.json";link.click();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    $('status').textContent='已準備草稿備份，請確認下載完成後再前往新管理頁。';
  });
}else{
  $('message').textContent=readable?'請點下方按鈕開啟新的密碼管理頁。':'瀏覽器目前無法確認舊草稿。你可以前往新的密碼管理頁；本頁不會修改或刪除任何資料。';
  $('draftNote').textContent='公開圖鑑與使用者的勾選紀錄維持原樣。';
}
}());</script></body></html>

<script>
// Keep reload position stable through native restoration and asynchronous layout.
(()=>{
 const key='jiwu_catalog_scroll_v1:'+location.pathname;
 const currentTab=()=>new URLSearchParams(location.search).get('tab')||'';
 let saved=null;try{saved=JSON.parse(sessionStorage.getItem(key)||'null');}catch(_){}
 const navigation=performance.getEntriesByType('navigation')[0];
 let pending=!!(saved&&Number.isFinite(saved.y)&&saved.tab===currentTab()&&(navigation?.type==='reload'||navigation?.type==='back_forward'||saved.reloadRequested));
 let frame=0,ready=false,dataDone=false,stopTimer=0,hardTimer=0,frozen=false;
 history.scrollRestoration='manual';
 function write(reloadRequested=false){try{sessionStorage.setItem(key,JSON.stringify({y:window.scrollY,tab:currentTab(),reloadRequested}));}catch(_){} }
 function save(){if(!pending&&!frozen)write();}
 function correct(){frame=0;if(!pending||!ready)return;const height=Math.max(document.documentElement.scrollHeight,document.body?.scrollHeight||0),max=Math.max(0,height-window.innerHeight);if(!dataDone&&max<saved.y)return;const y=Math.min(Math.max(0,saved.y),max);if(Math.abs(window.scrollY-y)>.5)window.scrollTo({top:y,behavior:'instant'});}
 function schedule(){if(pending&&ready&&!frame)frame=requestAnimationFrame(correct);}
 function finish(){if(!pending)return;correct();pending=false;cancelAnimationFrame(frame);clearTimeout(stopTimer);clearTimeout(hardTimer);resize?.disconnect();document.documentElement.style.removeProperty('overflow-anchor');document.body?.style.removeProperty('overflow-anchor');save();}
 function cancel(){if(!pending)return;pending=false;cancelAnimationFrame(frame);clearTimeout(stopTimer);clearTimeout(hardTimer);resize?.disconnect();document.documentElement.style.removeProperty('overflow-anchor');document.body?.style.removeProperty('overflow-anchor');save();}
 const resize=typeof ResizeObserver==='function'?new ResizeObserver(schedule):null;
 if(pending){document.documentElement.style.overflowAnchor='none';resize?.observe(document.documentElement);}
 function restore(final=false){if(!pending)return;ready=true;if(document.body){document.body.style.overflowAnchor='none';resize?.observe(document.body);}schedule();if(final&&!dataDone){dataDone=true;hardTimer=setTimeout(finish,8000);const pageReady=document.readyState==='complete'?Promise.resolve():new Promise(resolve=>window.addEventListener('load',resolve,{once:true}));const fontReady=document.fonts?.ready||Promise.resolve();Promise.allSettled([pageReady,fontReady]).then(()=>{if(pending){schedule();stopTimer=setTimeout(finish,1200);}});}}
 window.addEventListener('touchstart',cancel,{passive:true});window.addEventListener('wheel',cancel,{passive:true});window.addEventListener('keydown',cancel);
 window.addEventListener('scroll',()=>{if(pending)schedule();else save();},{passive:true});
 window.addEventListener('beforeunload',()=>{if(!pending&&!frozen){write(true);frozen=true;}});
 window.addEventListener('pagehide',()=>{if(!frozen)save();});
 window.addEventListener('pageshow',event=>{frozen=false;if(event.persisted){pending=false;cancelAnimationFrame(frame);clearTimeout(stopTimer);clearTimeout(hardTimer);save();}});
 window.jiwuCatalogReloadPosition={restore,reload(){if(!pending){write(true);frozen=true;}location.reload();}};
})();
</script>

/* 卡片樣式 (手機) */
.card {
  width: 100%;
  max-width: 135px;
  margin: 0 auto;
  border: 1.5px solid #ccc;
  border-radius: 8px;
  background-color: #ffffff !important;
  opacity: 1 !important;
  position: relative;
  cursor: pointer;
  transition: border-color 0.3s;
  text-align: center;
  user-select: none;
  color: #333333;
  box-shadow: none !important;
}

  height: auto;
  max-height: 130px;
  width: 100%;

  word-break: break-word;

  color: #333333 !important;
  display: block;
  width: 100%;
  box-sizing: border-box;
}
.card .name {
  font-weight: bold;
  margin-top: 2px;
  overflow-wrap: anywhere;
}

.card .size {
  padding-bottom: 5px;
  margin-top: -2px;
}
  
.card .checkmark {

  align-items: center;
  justify-content: center;
}

<script>
function fastImg(value){
 const url=String(value||'').trim().split(/\s+/)[0]||'';
 return url.replace(/^https:\/\/([^.]+)\.github\.io\/([^/]+)\/(.+)$/,'https://cdn.jsdelivr.net/gh/$1/$2@main/$3')
 .replace(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/,'https://cdn.jsdelivr.net/gh/$1/$2@$3/$4')
 .replace(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/raw\/([^/]+)\/(.+)$/,'https://cdn.jsdelivr.net/gh/$1/$2@$3/$4');
}
function catalogImageSources(value){
 const first=fastImg(value),match=first.match(/^https:\/\/(?:cdn|fastly)\.jsdelivr\.net\/gh\/([^/]+)\/([^/@]+)@([^/]+)\/(.+)$/);
 if(!match)return [first];
 const [,owner,repo,ref,path]=match;
 return [...new Set([first,`https://raw.githubusercontent.com/${owner}/${repo}/${ref}/${path}`,`https://${owner}.github.io/${repo}/${path}`])];
}
let catalogImageQueue=[],catalogImagesRunning=0;
function pumpCatalogImages(){
 while(catalogImagesRunning<6&&catalogImageQueue.length){
  const img=catalogImageQueue.shift();if(!img.isConnected)continue;
  catalogImagesRunning++;
  loadCatalogImage(img).finally(()=>{catalogImagesRunning--;pumpCatalogImages();});
 }
}
async function loadCatalogImage(img){
 for(const url of catalogImageSources(img.dataset.catalogSrc)){
  if(!img.isConnected)return;
  try{
   await new Promise((resolve,reject)=>{const probe=new Image();probe.onload=async()=>{try{if(probe.decode)await probe.decode();resolve();}catch(error){reject(error);}};probe.onerror=reject;probe.src=url;});
   if(!img.isConnected)return;
   img.onload=()=>img.classList.add('catalogImageReady');img.src=url;
   if(img.complete&&img.naturalWidth)img.classList.add('catalogImageReady');return;
  }catch(_){}
 }
 if(img.isConnected){img.classList.add('catalogImageReady');img.alt='圖片暫時無法載入';}
}
function prepareCatalogImages(){
 const images=[...cardContainer.querySelectorAll('img[data-catalog-src]')];
 images.forEach(img=>{img.classList.add('catalogProductImage');catalogImageQueue.push(img);});
 pumpCatalogImages();
}

const SHEET_ID = "17gH9HZKvW_6fMCWYLyqnzMHj40rA7PiwWg6L0GvbFgQ";

const colors = {

  "小桃": "#838BC2", "師傅": "#CCAFA5", "栗子": "#94C973",

const tabsContainer = document.getElementById("tabs");
const cardContainer = document.getElementById("card-container");
let collected = [];
function getCollectedKey(sheetName) {
  return `collectedDolls_${sheetName}`;
}
const tabElements = {};
let currentData = {};

function readQuantities(role){try{return JSON.parse(localStorage.getItem('jiwu_catalog_quantities_'+role))||{};}catch(_){return {};}}
function collectionQuantity(role,key){const owned=JSON.parse(localStorage.getItem(getCollectedKey(role)))||[];return owned.includes(key)?Math.max(1,Number(readQuantities(role)[key])||1):0;}
function storeQuantity(role,key,value){const quantities=readQuantities(role);let owned=JSON.parse(localStorage.getItem(getCollectedKey(role)))||[];owned=owned.filter(k=>k!==key);if(value>0){owned.push(key);quantities[key]=value;}else delete quantities[key];localStorage.setItem('jiwu_catalog_quantities_'+role,JSON.stringify(quantities));localStorage.setItem(getCollectedKey(role),JSON.stringify(owned));collected=owned;}
function typeCollectionLabel(type,role,data){let owned=0,total=0;for(const item of data){const qty=collectionQuantity(role,`${role}|${item.type||'無類型'}|${item.name}`);if(qty>0){owned++;total+=qty;}}return `${type} （${owned}/${data.length}款 ． 總數${total}）`;}
function renderTypeTitle(target,type,role,data){target.replaceChildren();const name=document.createElement('span');name.className='type-title-name';name.textContent=type;const counts=document.createElement('span');counts.className='type-title-counts';counts.textContent=typeCollectionLabel(type,role,data).slice(type.length).trim();target.append(name,counts);}
var collectionReturnTimer;
function showCollectionReturn(role,key,previousQuantity){const notice=document.getElementById('collectionReturnNotice'),button=document.getElementById('collectionReturnButton');clearTimeout(collectionReturnTimer);notice.hidden=false;button.onclick=()=>{clearTimeout(collectionReturnTimer);notice.hidden=true;if(collectionQuantity(role,key)!==0)return;storeQuantity(role,key,previousQuantity);const activeRole=document.querySelector('.tab.active .tab-name')?.textContent||getInitialSheet();collected=JSON.parse(localStorage.getItem(getCollectedKey(activeRole)))||[];updateTabCount(role);if(activeRole===role&&currentData[role])renderCards(currentData[role],role);};collectionReturnTimer=setTimeout(()=>{notice.hidden=true;button.onclick=null;},5000);}
function openQuantityDialog(role,item,key,refresh){const dialog=document.getElementById('quantityDialog'),input=document.getElementById('quantityValue');document.getElementById('quantityName').textContent=item.name;dialog.style.setProperty('--quantity-color',colors[role]);input.value=collectionQuantity(role,key);const value=()=>Math.max(0,Math.min(9999,Math.floor(Number(input.value)||0)));document.getElementById('quantityMinus').onclick=()=>input.value=Math.max(0,value()-1);document.getElementById('quantityPlus').onclick=()=>input.value=Math.min(9999,value()+1);document.getElementById('quantityCancel').onclick=()=>dialog.close();document.getElementById('quantitySave').onclick=()=>{if(!input.checkValidity()){input.reportValidity();return;}storeQuantity(role,key,value());refresh();dialog.close();};dialog.showModal();}
function heartIcon(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>';}
function readWishes(){try{return JSON.parse(localStorage.getItem('jiwu_catalog_wishes_v1'))||{};}catch(_){return {};}}
function addWishButton(card,item,role){const key=`${role}|${item.type}|${item.name}`,button=document.createElement('button');button.type='button';button.className='wish-heart';button.style.setProperty('--wish-color',colors[role]);button.innerHTML=heartIcon();const refresh=()=>{const saved=!!readWishes()[key];button.setAttribute('aria-pressed',String(saved));button.setAttribute('aria-label',(saved?'取消想收：':'想收：')+item.name);};refresh();button.onclick=e=>{e.stopPropagation();const wishes=readWishes();if(wishes[key])delete wishes[key];else wishes[key]={...item,role};localStorage.setItem('jiwu_catalog_wishes_v1',JSON.stringify(wishes));refresh();};card.append(button);}
var shopInventory=[],launchInventory=[],wishInventoryTicket=0,wishLaunchTicket=0,wishPurchaseLoading=false,wishPurchaseRefresh=null;
async function requestLiveWishData(sheet){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const url=new URL('https://jiwu-mac-relay.jiwusales.workers.dev/functions/v1/jiwu-public');url.searchParams.set('format','json');url.searchParams.set('sheet',sheet);url.searchParams.set('_',Date.now());const response=await fetch(url,{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('商品資料連線失敗');const data=await response.json();if(!Array.isArray(data.table?.cols)||!Array.isArray(data.table?.rows))throw Error('商品資料格式不正確');return data;}finally{clearTimeout(timer);}}
function refreshWishPurchaseData(showLoading=false){if(wishPurchaseRefresh){if(showLoading)drawWishList();return wishPurchaseRefresh;}wishPurchaseLoading=true;if(showLoading&&document.getElementById('wishListDialog').open)drawWishList();wishPurchaseRefresh=Promise.allSettled([fetchWishInventory(),fetchWishLaunches()]).finally(()=>{wishPurchaseLoading=false;wishPurchaseRefresh=null;if(!wishPurchaseLoading&&document.getElementById('wishListDialog').open)drawWishList();});return wishPurchaseRefresh;}
function normalizedProduct(value){return String(value||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');}
function productCode(value){return String(value||'').normalize('NFKC').trim();}
function productURL(value){try{const url=new URL(String(value||'').trim());if(!/^https?:$/.test(url.protocol))return '';const product=url.pathname.match(/\/products\/([^/]+)/);const path=product?'/products/'+product[1]:url.pathname.replace(/\/+$/,'');return url.hostname.toLowerCase().replace(/^www\./,'')+path;}catch(_){return '';}}
function wishIdentity(item){const source=(currentData[item.role]||[]).find(p=>p.type===item.type&&p.name===item.name);return {...item,sn:source?.sn||item.sn||'',url:source?.url||item.url||''};}
function wishShopMatch(item){const identity=wishIdentity(item),code=productCode(identity.sn),url=productURL(identity.url);const pools=[shopInventory.filter(shopCanOrder),launchInventory.filter(shopCanOrder)];for(const test of [p=>code&&productCode(p.sn)===code,p=>url&&productURL(p.url)===url&&!(code&&productCode(p.sn)&&productCode(p.sn)!==code),p=>p.role===item.role&&normalizedProduct(p.name)===normalizedProduct(item.name)&&(!p.type||p.type===item.type)&&!(code&&productCode(p.sn)&&productCode(p.sn)!==code)]){for(const pool of pools){const matches=pool.filter(test);if(matches.length===1)return matches[0];if(matches.length>1)return null;}}return null;}
function shopCanOrder(product){if(product.closed||/已收單|已結單|已結團|停止收單|下架/.test(String(product.status||'')+' '+String(product.listing||'')))return false;const stock=String(product.stock).trim().toLowerCase();if(product.source==='launch')return !!product.itemId&&!!product.group&&!product.paused&&!product.hidden&&!!String(product.price).trim()&&!['0','n'].includes(String(product.price).trim().toLowerCase())&&stock!=='-';return !!product.sn&&!!product.page&&!!String(product.price).trim()&&!['0','n'].includes(String(product.price).trim().toLowerCase())&&!['x','ｘ','-'].includes(stock);}
var wishExpiryTimer;

function formatName(name) {
  if (!name) return "";
  const cleanName = name.trim();
  const totalLength = cleanName.length;
  if (totalLength <= 9) return cleanName;
  const maxLengthBeforeWrap = 9;
  const spaceIndex = cleanName.lastIndexOf(" ", maxLengthBeforeWrap);
  if (spaceIndex > 0) {
    return cleanName.slice(0, spaceIndex) + "<br>" + cleanName.slice(spaceIndex + 1);
  }
  return cleanName.slice(0, maxLengthBeforeWrap) + "<br>" + cleanName.slice(maxLengthBeforeWrap);
}

function createTab(sheetName) {
  const tab = document.createElement("div");
  tab.className = "tab";
  tab.style.setProperty("--tab-color", colors[sheetName] || "#999");
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.documentElement.style.setProperty('--tab-color', colors[sheetName] || "#999");
    const url = new URL(window.location);
    url.searchParams.set("tab", sheetName);
    window.history.replaceState(null, "", url);
    loadSheetData(sheetName);
  });
  tabsContainer.appendChild(tab);
  tabElements[sheetName] = tab;
}

function updateTabCount(sheetName) {
  if (sheetName === "重置圖鑑") return;
  const data = currentData[sheetName] || [];
  const storedCollected = JSON.parse(localStorage.getItem(getCollectedKey(sheetName))) || [];
  const ownedCount = data.filter(item => storedCollected.includes(`${sheetName}|${item.type}|${item.name}`)).length;
  const totalCount = data.length;
  const totalQuantity = data.reduce((sum,item)=>sum+collectionQuantity(sheetName,`${sheetName}|${item.type}|${item.name}`),0);
  const percent = totalCount ? ownedCount / totalCount : 0;
  const radius = 28;
  const strokeWidth = 4;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference * (1 - percent);
  if (tabElements[sheetName]) {
    tabElements[sheetName].innerHTML = `
      <div class="tab-circle">
        <img src="${fastImg(images[sheetName])}" alt="${sheetName}" loading="lazy" decoding="async" fetchpriority="low">
        <svg width="70" height="70">
          <circle cx="35" cy="35" r="${radius}" stroke="#e0e0e0" stroke-width="${strokeWidth}" fill="none"></circle>
          <circle cx="35" cy="35" r="${radius}" stroke="${colors[sheetName] || '#999'}" stroke-width="${strokeWidth}" fill="none"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="${percent < 0.01 ? 'butt' : 'round'}" visibility="${ownedCount > 0 ? 'visible' : 'hidden'}"></circle>
        </svg>
      </div>
      <div class="tab-label">
        <div class="tab-name">${sheetName}</div>
        <div class="tab-count">${ownedCount}/${totalCount} (${totalQuantity})</div>
      </div>
    `;
  }
}

function updateNavBarWithTypes(types, sheetName) {
  const navBar = document.getElementById("nav-bar");
  if (!navBar) return;
  navBar.innerHTML = "";
  types.forEach((type) => {
    const a = document.createElement("a");
    a.href = `#${type}`;
    a.textContent = type;
    a.addEventListener("click", e => {
      e.preventDefault();
      navBar.querySelectorAll("a").forEach(link => link.classList.remove("active"));
      a.classList.add("active");
      
      const targetId = a.getAttribute("href").substring(1);
      const targetElem = document.getElementById(targetId);
      if (targetElem) {
        // 設定滾動偏移量 (top-bar 40px + nav-bar 42px + 一點餘裕)
        const offset = 92;
        const elementPosition = targetElem.getBoundingClientRect().top + window.pageYOffset;
        window.scrollTo({
          top: elementPosition - offset,
          behavior: "smooth"
        });
      }
    });
    navBar.appendChild(a);
  });
}
